name: Test Scala and Mercury Examples

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-scala:
    name: Test Scala Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build and run Scala test container
        run: |
          docker build -t scala-test:latest -f .github/Dockerfile.scala .
          docker run --rm scala-test:latest /app/.github/test-scala.sh

  test-mercury:
    name: Test Mercury Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build and run Mercury test container
        run: |
          docker build -t mercury-test:latest -f .github/Dockerfile.mercury .
          docker run --rm mercury-test:latest /app/.github/test-mercury.sh

  verify-examples:
    name: Verify Example Files
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check required files exist
        run: |
          echo "Checking Scala example files..."
          test -f jeff/subprograms/scala_subprograms.scala || exit 1
          test -f jeff/data_types_or_binding/scala_data_types_or_binding.scala || exit 1
          test -f jeff/control_structures/scala_control_structures.scala || exit 1
          
          echo "Checking Mercury example files..."
          test -f jeff/subprograms/mercury_subprograms.m || exit 1
          test -f jeff/data_types_or_binding/mercury_data_types_or_binding.m || exit 1
          test -f jeff/control_structures/mercury_control_structures.m || exit 1
          
          echo "All required files exist!"
      
      - name: Check README exists
        run: |
          test -f jeff/README.md && echo "README found" || exit 1
