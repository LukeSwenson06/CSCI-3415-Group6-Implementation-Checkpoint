name: Test Scala and Mercury Examples

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-scala:
    name: Test Scala Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Scala container
        run: |
          docker build -t scala-test:latest -f jeff/scala/Dockerfile.scala .
      
      - name: Check Scala version
        run: |
          echo "=== Scala Environment ==="
          docker run --rm scala-test:latest scala -version

      - name: Run Scala tests
        run: |
          docker run --rm scala-test:latest bash /app/jeff/scala/test-scala.sh

  test-mercury:
    name: Test Mercury Examples
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build Mercury container
        run: |
          docker build -t mercury-test:latest -f jeff/mercury/Dockerfile.mercury .
      
      - name: Check Mercury version
        run: |
          echo "=== Mercury Environment ==="
          docker run --rm mercury-test:latest mmc --version

      - name: Run Mercury tests
        run: |
          docker run --rm mercury-test:latest bash /app/jeff/mercury/test-mercury.sh
